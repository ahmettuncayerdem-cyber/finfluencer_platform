  <text x="950" y="522" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">(financial topics, content,</text>
  <text x="950" y="536" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">economic issues)</text>
  <use href="#iconNews" x="900" y="546" width="34" height="34"/>
  <use href="#iconBars" x="1000" y="546" width="34" height="34"/>
  <path d="M 885 588 Q 950 618 1015 588" stroke="#2E6F95" stroke-width="4" fill="none" stroke-linecap="round"/>

