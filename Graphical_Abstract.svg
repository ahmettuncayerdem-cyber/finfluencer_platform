  <text x="1450" y="522" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">(credibility, opinion leadership,</text>
  <text x="1450" y="536" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">parasocial interaction)</text>
