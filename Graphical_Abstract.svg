  <text x="1760" y="112" font-size="21" font-weight="700" fill="#1B3A5C">BERT Sentiment</text>
  <text x="1760" y="136" font-size="21" font-weight="700" fill="#1B3A5C">Classification</text>
  <text x="1690" y="192" font-size="26" font-weight="800" fill="#2E6F95">Positive vs. Negative</text>
  <text x="1690" y="216" font-size="15" fill="#374151">comment-level polarity</text>
  <text x="1690" y="252" font-size="14" fill="#6B7280">Transformer-based, validated against</text>
  <text x="1690" y="272" font-size="14" fill="#6B7280">human coding (Cohen's kappa = 0.947)</text>

