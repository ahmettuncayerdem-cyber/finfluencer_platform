<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1080" width="2400" height="1080" font-family="Arial, Helvetica, sans-serif">
  <title>Graphical Abstract: Message versus Messenger Effects on Investor Sentiment</title>
