  <use href="#iconStar" x="1778" y="486" width="34" height="34"/>
  <text x="1822" y="502" font-size="15" font-weight="800" fill="#8A6114">Tunç Şatıroğlu</text>
  <text x="1778" y="530" font-size="13" fill="#6B4E15">Strongest and most persistent</text>
  <text x="1778" y="548" font-size="13" fill="#6B4E15">messenger effect - robust</text>
  <text x="1778" y="566" font-size="13" fill="#6B4E15">across all estimation methods</text>

  <text x="1200" y="775" font-size="19" font-weight="700" fill="#1B3A5C" text-anchor="middle">Variance Explained in Comment-Level Sentiment</text>

  <text x="740" y="812" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="end">Topic (Message)</text>
  <rect x="750" y="794" width="700" height="30" fill="#2E6F95" rx="3"/>
  <text x="1465" y="815" font-size="16" font-weight="800" fill="#1B3A5C">24.4%</text>

  <text x="740" y="856" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="end">Analyst (Messenger)</text>
  <rect x="750" y="838" width="155" height="30" fill="#5B6B84" rx="3"/>
  <text x="920" y="859" font-size="16" font-weight="800" fill="#1B3A5C">5.4%</text>

  <text x="1200" y="895" font-size="13" font-style="italic" fill="#6B7280" text-anchor="middle">Full joint model R-sq = 25.9%; topic and analyst identity together leave ~74% of variance unexplained.</text>
  <g>
    <rect x="60" y="925" width="440" height="92" rx="10" fill="#F7F8FA" stroke="#E2E5EA"/>
    <use href="#iconCompare" x="76" y="951" width="40" height="40"/>
    <text x="128" y="956" font-size="13" font-weight="700" fill="#1B3A5C">Topic explains substantially more</text>
    <text x="128" y="975" font-size="13" font-weight="700" fill="#1B3A5C">variance than communicator identity</text>
  </g>
  <g>
    <rect x="520" y="925" width="440" height="92" rx="10" fill="#F7F8FA" stroke="#E2E5EA"/>
    <use href="#iconCheck" x="536" y="951" width="40" height="40"/>
    <text x="588" y="956" font-size="13" font-weight="700" fill="#1B3A5C">Communicator identity remains</text>
    <text x="588" y="975" font-size="13" font-weight="700" fill="#1B3A5C">significant net of topic composition</text>
  </g>
  <g>
    <rect x="980" y="925" width="440" height="92" rx="10" fill="#FDF6E9" stroke="#D9A441"/>
    <use href="#iconStar" x="996" y="951" width="40" height="40"/>
    <text x="1048" y="956" font-size="13" font-weight="700" fill="#8A6114">Şatıroğlu shows the strongest,</text>
    <text x="1048" y="975" font-size="13" font-weight="700" fill="#8A6114">most persistent messenger effect</text>
  </g>
  <g>
    <rect x="1440" y="925" width="440" height="92" rx="10" fill="#F7F8FA" stroke="#E2E5EA"/>
    <use href="#iconFlat" x="1456" y="951" width="40" height="40"/>
    <text x="1508" y="956" font-size="13" font-weight="700" fill="#1B3A5C">No contemporaneous link between</text>
    <text x="1508" y="975" font-size="13" font-weight="700" fill="#1B3A5C">sentiment and BIST100 returns</text>
  </g>
  <g>
    <rect x="1900" y="925" width="440" height="92" rx="10" fill="#F7F8FA" stroke="#E2E5EA"/>
    <use href="#iconForecast" x="1916" y="951" width="40" height="40"/>
    <text x="1968" y="956" font-size="13" font-weight="700" fill="#1B3A5C">Sentiment Granger-predicts</text>
    <text x="1968" y="975" font-size="13" font-weight="700" fill="#1B3A5C">short-term BIST100 returns</text>
  </g>

  <rect x="0" y="1030" width="2400" height="50" fill="#1B3A5C"/>
  <text x="1200" y="1061" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Investor sentiment in digital financial ecosystems is jointly shaped by message content and communicator identity.</text>
