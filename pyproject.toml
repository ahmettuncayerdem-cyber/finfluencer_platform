#
# pyproject.toml — Finfluencer Research Platform v2.1
#
# This file is the source of truth for:
#   - Package metadata
#   - Runtime and development dependencies (with reproducible pinning)
#   - Build backend (Poetry)
#   - Static analysis (Ruff, MyPy)
#   - Testing (pytest, coverage)
#
# Reproducibility contract:
#   1. All runtime dependency versions are expressed as caret ranges (^X.Y.Z),
#      permitting compatible upgrades without silent breakage.
#   2. `poetry.lock` (generated by `poetry lock`) pins exact resolved versions
#      and MUST be committed to the repository. Any change to `poetry.lock`
#      constitutes an implementation change and is reviewable in CI.
#   3. Python version is bounded on both sides. Upper bound prevents installation
#      on untested future versions until we validate them.
#   4. External model revisions (HuggingFace) are NOT pinned here; they belong
#      in `config/settings.yaml` where they can be per-study.
#

[tool.poetry]
name = "finfluencer-platform"
version = "0.1.0"
description = "A reusable computational research platform for empirical studies of financial YouTube communities, retail investor behaviour, and finfluencer discourse. Frozen architecture v2.1."
license = "MIT"
authors = ["Finfluencer Research Group <replace-with-project-email@example.org>"]
readme = "README.md"
homepage = "https://github.com/REPLACE-ORG/finfluencer-platform"
repository = "https://github.com/REPLACE-ORG/finfluencer-platform"
documentation = "https://REPLACE-ORG.github.io/finfluencer-platform"
keywords = [
    "computational-social-science",
    "behavioural-finance",
    "retail-investor-sentiment",
    "youtube",
    "sentiment-analysis",
    "topic-modeling",
    "bertopic",
    "finfluencer",
    "turkish-nlp",
    "reproducible-research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
packages = [{ include = "finfluencer", from = "src" }]


# ==============================================================================
# Runtime dependencies (always installed)
# ==============================================================================
#
# Grouped by functional purpose. Every entry is a caret range: ^X.Y.Z means
# ">=X.Y.Z, <(X+1).0.0". This is the industry-standard SemVer-respecting range
# that allows security patches and additive minor updates while blocking major
# API changes.
#

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# ---- Configuration and validation --------------------------------------------
# pydantic v2 provides schema validation and is the backbone of core.contracts.
# pydantic-settings extends it for environment/YAML-driven settings.
pydantic         = "^2.5"
pydantic-settings = "^2.1"
pyyaml           = "^6.0"
python-dotenv    = "^1.0"

# ---- Logging, CLI, and console ----------------------------------------------
# structlog produces JSON-structured logs required by the reproducibility layer.
# typer is a modern, type-hint-driven CLI framework built on click.
# rich powers coloured console output and progress bars.
structlog = "^24.1"
typer     = "^0.9"
click     = ">=7.1.1,<8.2.0"  # pinned: typer 0.9.x incompatible with click's ctx-arg change in make_metavar() (8.2.0+)
rich      = "^13.7"

# ---- Data structures and I/O -------------------------------------------------
# pandas for tabular manipulation; pyarrow as the Parquet backend (essential
# for lossless persistence of nested types such as the emoji list column).
# openpyxl only for Excel writing of publication tables.
numpy    = "^1.26"
pandas   = "^2.1"
pyarrow  = "^15.0"
openpyxl = "^3.1"

# ---- HTTP and external APIs --------------------------------------------------
# httpx supports both sync and async, which we may need in later phases for
# concurrent market-data retrieval.
# google-api-python-client is the official YouTube Data API v3 client.
# tenacity provides declarative retry logic; used by core/logging and utils.
httpx                    = "^0.27"
google-api-python-client = "^2.111"
tenacity                 = "^8.2"
youtube-transcript-api   = "^0.6"

# ---- API layer ----------------------------------------------------------------
# fastapi: ADR-0001's already-accepted API/web framework choice (docs/adr/
# 0001-technology-stack.md) -- not a new decision, just the first task (BACKLOG.md
# T-012) that actually needs it added and installed. FastAPI's own request/response
# validation is Pydantic v2, matching core/contracts.py's existing style exactly
# (ADR-0001's own reasoning). uvicorn is the standard ASGI server every FastAPI
# deployment needs to actually run as a process (BACKLOG.md T-014); not a separate
# architectural decision, the uncontroversial default server for this framework.
fastapi                  = "^0.109"
uvicorn                  = "^0.27"

# ---- NLP models and embeddings -----------------------------------------------
# torch is pulled by transformers and sentence-transformers. We do not pin its
# CUDA variant here; users install CPU or GPU wheels per their environment.
# bertopic transitively includes umap-learn and hdbscan; we do not need to
# declare them separately.
transformers          = "^4.36"
sentence-transformers = "^2.3"
bertopic              = "^0.16"
# TEMPORARY PIN (2026-07-27): torch >=2.9.0 triggers a Windows-only DLL
# initialization failure (OSError WinError 1114, torch/lib/c10.dll) when
# any pandas/pyarrow-touching import happens before torch in the same
# process. Confirmed via isolated, repository-independent experiments as
# an upstream PyTorch regression, not specific to this repository or
# environment (see pytorch/pytorch#166628, open upstream as of this
# writing). torch 2.8.0 does not exhibit this failure with our pinned
# pandas/pyarrow/numpy versions. Revert to "^2.2" (or a newer caret
# range) once the upstream issue is resolved and the fix is verified
# not to regress. See KNOWN_ISSUES.md for the full investigation.
torch                 = ">=2.8.0,<2.9.0"
langdetect            = "^1.0.9"

# ---- Statistics and multivariate methods ------------------------------------
# scipy for chi-square and related tests.
# statsmodels for OLS and the video-level H4 regression.
# scikit-learn for hierarchical clustering (Ward linkage).
# prince is the standard Python correspondence-analysis package.
# pymannkendall provides the Mann-Kendall trend test used by
# reporting.inferential's R1 weekly-trend analysis.
# scikit-posthocs provides Dunn's post-hoc test used by
# reporting.inferential's E1 cross-analyst comparison.
scipy           = "^1.11"
statsmodels     = "^0.14"
scikit-learn    = "^1.3"
prince          = "^0.13"
pymannkendall   = "^1.4"
scikit-posthocs = "^0.14"

# ---- Visualisation ----------------------------------------------------------
# matplotlib as the primary engine; seaborn as a statistical facade.
# Plotly comes in via BERTopic for its own visualisations; not declared here.
matplotlib = "^3.8"
seaborn    = "^0.13"

# ---- Templating (report / Publication Engine) -------------------------------
jinja2 = "^3.1"

# ---- Reproducibility --------------------------------------------------------
# gitpython lets core.reproducibility capture the exact commit hash on every
# pipeline run and refuse to proceed if the working tree is dirty in strict mode.
gitpython = "^3.1"

# ---- Optional (declared here, activated via [tool.poetry.extras]) -----------
# Reserved for Phase 6 (Module J: LLM Integration). Never installed by default.
openai    = { version = "^1.10", optional = true }
anthropic = { version = "^0.18", optional = true }

# Reserved for the market-integration extension (finfluencer.market /
# finfluencer.providers.market). Never installed by default; the NLP
# pipeline has no dependency on it. yfinance is the only new package
# required -- the TCMB EVDS provider reuses the existing httpx dependency.
yfinance = { version = "^0.2", optional = true }


# ==============================================================================
# Extras (opt-in feature bundles)
# ==============================================================================
#
# Users install extras with `poetry install --extras llm` or, for pip users,
# `pip install "finfluencer-platform[llm]"`.
#

[tool.poetry.extras]
llm = ["openai", "anthropic"]
market = ["yfinance"]


# ==============================================================================
# Development dependencies (not installed for end users)
# ==============================================================================

[tool.poetry.group.dev.dependencies]
pytest        = "^7.4"
pytest-cov    = "^4.1"
pytest-mock   = "^3.12"
hypothesis    = "^6.98"
responses     = "^0.24"
ruff          = "^0.2"
mypy          = "^1.8"
pre-commit    = "^3.6"
types-pyyaml  = "^6.0"
pandas-stubs  = "^2.1"


# ==============================================================================
# Docs group (only installed when building documentation)
# ==============================================================================
psutil = "^7.2.2"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs          = "^1.5"
mkdocs-material = "^9.5"


# ==============================================================================
# CLI entry point
# ==============================================================================
#
# After `poetry install`, the command `finfluencer --help` becomes available.
# The Typer app object is defined in src/finfluencer/cli.py (Phase 1, later file).
#

[tool.poetry.scripts]
finfluencer = "finfluencer.cli:app"


# ==============================================================================
# Build backend
# ==============================================================================

[build-system]
requires      = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"


# ==============================================================================
# pytest configuration
# ==============================================================================
#
# --strict-markers and --strict-config protect against typos in marker names
# and configuration keys — a common source of silently skipped tests in
# research code.
#

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=finfluencer",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: pure unit tests, no external dependencies",
    "integration: tests that mock external services (YouTube API, HTTP)",
    "contract: schema-level tests on inter-module Pydantic contracts",
    "reproducibility: tests that verify bit-identical output across runs",
    "slow: tests taking more than five seconds",
    "gpu: tests requiring a GPU (skipped by default)",
]


# ==============================================================================
# Ruff: linting and formatting
# ==============================================================================
#
# Ruff replaces the classic flake8 + isort + pyupgrade + bandit + black stack
# with one tool an order of magnitude faster. In 2026 it is the mainstream
# choice for new Python projects.
#

[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernise syntax)
    "S",     # bandit (security warnings)
    "B",     # bugbear (common bugs)
    "A",     # flake8-builtins (don't shadow builtins)
    "C4",    # comprehensions
    "SIM",   # simplify
    "TID",   # tidy imports
    "RET",   # return-statement checks
    "PL",    # pylint subset
    "RUF",   # ruff-specific
]
ignore = [
    "PLR0913",  # too many function arguments — sometimes unavoidable in scientific code
    "PLR0915",  # too many statements — pipeline functions can be long
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"   = ["S101", "PLR2004"]  # asserts and magic numbers permitted in tests
"scripts/**/*.py" = ["T201"]              # print statements permitted in scripts

# --- Sprint 2.7A scoped quality gate (reporting/cli.py deliverables only) ---
# These are stylistic findings, deliberately NOT fixed in code per the
# 2.7A policy: no reformatting, no line-shortening, no refactoring of
# working code. Genuine correctness findings (B904, stale noqa, B905,
# F401, S110/SIM105) were fixed in code instead and are not listed here.
"src/finfluencer/reporting/**/*.py" = [
    "E501",    # long lines — manuscript table/figure literals are wide by nature
    "RUF001",  # ambiguous unicode — Turkish literals and math symbols (rho, minus) in manuscript output
    "UP035",   # Callable import from typing vs. collections.abc — existing accepted pattern
    "UP037",   # quoted type annotation — existing accepted pattern
    "PLR2004", # magic value in comparison
    "RUF005",  # list concatenation vs. unpacking — existing accepted pattern
    "I001",    # import block sort order — reformatting out of scope for 2.7A
]
"src/finfluencer/reporting/main.py" = [
    "B008",    # typer.Option() as an argument default is Typer's own required API pattern
]
"tests/unit/test_reporting/**/*.py" = [
    "E501",    # long lines
    "UP037",   # quoted type annotation — existing accepted pattern
    "N806",    # module-level constant referenced inside a function — existing accepted pattern
]
"tests/unit/test_cli.py" = [
    "E501",    # long lines
    "PLW1510", # subprocess.run without check= — these CLI smoke tests assert on .returncode themselves
    "S603",    # subprocess call — invokes sys.executable with test-controlled args, not untrusted input
]

[tool.ruff.format]
quote-style        = "double"
indent-style       = "space"
docstring-code-format = true


# ==============================================================================
# MyPy: static type checking
# ==============================================================================
#
# strict = true is deliberate. Type errors caught at design time are one of the
# cheapest defences against silent scientific errors (e.g. passing a
# per-comment array to a per-analyst function).
#

[tool.mypy]
python_version              = "3.11"
strict                       = true
warn_return_any              = true
warn_unused_configs          = true
disallow_untyped_defs        = true
disallow_incomplete_defs     = true
check_untyped_defs           = true
disallow_untyped_decorators  = true
no_implicit_optional         = true
warn_redundant_casts         = true
warn_unused_ignores          = true
warn_no_return               = true
warn_unreachable             = true
show_error_codes             = true
pretty                       = true

# Libraries without type stubs — MyPy would otherwise fail on every import.
[[tool.mypy.overrides]]
module = [
    "bertopic.*",
    "prince.*",
    "langdetect.*",
    "hdbscan.*",
    "umap.*",
    "googleapiclient.*",
    "google.*",
    "sentence_transformers.*",
    "responses.*",
    "statsmodels.*",
    "openpyxl.*",        # used by reporting/manuscript_tables.py — no stub package declared
    "scipy.*",            # used by reporting/inferential.py — no stub package declared
    "pymannkendall.*",    # used by reporting/inferential.py — no stub package declared
    "scikit_posthocs.*",  # used by reporting/inferential.py — no stub package declared
]
ignore_missing_imports = true


# ==============================================================================
# Coverage configuration
# ==============================================================================

[tool.coverage.run]
source = ["src/finfluencer"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",  # thin CLI wrapper; exercised by CLI integration tests
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol ellipsis bodies are structurally uncoverable
]
show_missing = true
precision    = 2
# Phase 1 target 75%; rises to 85% as Phase 2 concrete providers land.
fail_under   = 75
