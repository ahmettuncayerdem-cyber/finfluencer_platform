# per the explicit operator instruction to validate end-to-end, not start
# large-scale collection. This matches the Phase 2 report's own Pilot
# Collection Plan recommendation ("start with 1 channel"). The other two
# approved channels (Al Jazeera English, TRT World; see
# docs/research/GAZA_PILOT_MINIMAL_DESIGN.md sec.3) are listed below,
# commented out, with their real verified channel IDs already filled in
# -- extending to the full 3-channel pilot later is an uncomment, not new
# lookup work.
#
# Channel IDs verified directly against each channel's own live
# YouTube "about" page on 2026-08-07 (not guessed):
#   BBC News            -> https://www.youtube.com/@BBCNews/about
#   Al Jazeera English   -> https://www.youtube.com/@AlJazeeraEnglish/about
#   TRT World            -> https://www.youtube.com/@trtworld/about
#
# `expertise_class` uses the new `news_media_international` value added
# to core/contracts.py's ExpertiseClass enum on 2026-08-07 specifically
# for this study -- the four original Turkish-study values (technical_
# macro, macro_political, long_horizon, equity_portfolio) describe
# financial-analyst expertise and do not honestly describe an
# international news broadcaster; seeing this comment is the intended
# way to notice that decision, not just the code diff. See
# docs/research/GAZA_PILOT_PHASE2_INFRASTRUCTURE.md sec.4 for the full
# reasoning and core/contracts.py's own updated docstring for the
# additive-only scope of that change.
#
# The field names below ("analyst", "expertise_class", "expertise_
# description") are the schema's own names (AnalystRecord, core/
# contracts.py) -- reused as-is because this pilot study intentionally
# does not fork the schema for a single field-naming preference; read
# "analyst" here as "roster entry" / "channel", not as a claim that
# BBC News is a financial analyst.
# =============================================================================


