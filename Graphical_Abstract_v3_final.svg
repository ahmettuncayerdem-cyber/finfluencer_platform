  <text x="1600" y="308" font-size="14" font-weight="800" fill="#2E6F95">R&#178; Topic = 24.4%</text>
  <text x="1600" y="328" font-size="14" font-weight="800" fill="#5B6B84">R&#178; Messenger = 5.4%</text>
