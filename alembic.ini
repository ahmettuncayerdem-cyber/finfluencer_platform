[alembic]
# EPIC-07' / ADR-0001-A. script_location points at this repo's alembic/ directory.
# sqlalchemy.url is deliberately NOT set here -- alembic/env.py resolves it at runtime from
# the FINFLUENCER_DB_URL environment variable (default: the same
# sqlite:///<repo_root>/data/finfluencer.db path bootstrap.py's durable mode uses), so the
# same alembic.ini works unchanged against a future PostgreSQL URL (ADR-0001-A's
# forward-compatibility guarantee, applied to migrations specifically).
script_location = alembic

prepend_sys_path = .

version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
